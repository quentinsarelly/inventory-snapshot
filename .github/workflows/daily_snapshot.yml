name: Daily Inventory Snapshot

on:
  schedule:
    # 11:23 UTC = 6:23am EST / 7:23am EDT. Deliberately NOT on the hour:
    # "0 11" is a heavily contended slot and GitHub deprioritises scheduled
    # workflows, which spread actual start times across 11:16-20:37 UTC over
    # the last 120 days. An off-peak minute keeps the start time closer to the
    # scheduled one.
    #
    # Avoid scheduling into 15:30-15:50 UTC (EDT) / 16:30-16:50 UTC (EST) —
    # Amazon's daily FBA maintenance window, 11:30-11:50 US Eastern year-round,
    # during which the amazon_us report returns FATAL. See connectors/amazon.py.
    # A delayed run can still drift into it; connectors/amazon.py retries long
    # enough to outlast it.
    - cron: "23 11 * * *"
  workflow_dispatch:       # allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all connectors
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_API_VERSION:       ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_CLIENT_ID:         ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET:     ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_US_SHOP_DOMAIN:    ${{ secrets.SHOPIFY_US_SHOP_DOMAIN }}
          SHOPIFY_MX_SHOP_DOMAIN:    ${{ secrets.SHOPIFY_MX_SHOP_DOMAIN }}
          SHOPIFY_US_ACCESS_TOKEN:   ${{ secrets.SHOPIFY_US_ACCESS_TOKEN }}
          SHOPIFY_MX_ACCESS_TOKEN:   ${{ secrets.SHOPIFY_MX_ACCESS_TOKEN }}
          AMAZON_LWA_APP_ID:         ${{ secrets.AMAZON_LWA_APP_ID }}
          AMAZON_LWA_CLIENT_SECRET:  ${{ secrets.AMAZON_LWA_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN_US:   ${{ secrets.AMAZON_REFRESH_TOKEN_US }}
          AMAZON_REFRESH_TOKEN_MX:   ${{ secrets.AMAZON_REFRESH_TOKEN_MX }}
          AMAZON_AWS_ACCESS_KEY:     ${{ secrets.AMAZON_AWS_ACCESS_KEY }}
          AMAZON_AWS_SECRET_KEY:     ${{ secrets.AMAZON_AWS_SECRET_KEY }}
          AMAZON_ROLE_ARN:           ${{ secrets.AMAZON_ROLE_ARN }}
          TIKTOK_APP_KEY:            ${{ secrets.TIKTOK_APP_KEY }}
          TIKTOK_APP_SECRET:         ${{ secrets.TIKTOK_APP_SECRET }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN:      ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SHOP_ID:            ${{ secrets.TIKTOK_SHOP_ID }}
          TIKTOK_SHOP_CYPHER:        ${{ secrets.TIKTOK_SHOP_CYPHER }}
          SHIPHERO_REFRESH_TOKEN:    ${{ secrets.SHIPHERO_REFRESH_TOKEN }}
          CAMELOT_SOAP_URL:          ${{ secrets.CAMELOT_SOAP_URL }}
          CAMELOT_USERNAME:          ${{ secrets.CAMELOT_USERNAME }}
          CAMELOT_PASSWORD:          ${{ secrets.CAMELOT_PASSWORD }}
          CAMELOT_INTERFACE_PROFILE: ${{ secrets.CAMELOT_INTERFACE_PROFILE }}
          CAMELOT_CLIENT:            ${{ secrets.CAMELOT_CLIENT }}
          CAMELOT_TRADING_PARTNER:   ${{ secrets.CAMELOT_TRADING_PARTNER }}
        run: python run_all.py
